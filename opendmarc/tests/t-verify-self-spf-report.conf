# isc.org self-SPF test with forensic report capture (RFC 9991 SPF-DNS field).
# isc.org publishes a real ruf= address and an SPF record with several
# include: mechanisms, so a genuine chain of SPF-record lookups gets logged.
Background		No
SPFSelfValidate		Yes
LogSPFDNS		Yes
FailureReports		Yes
FailureReportsOnNone	Yes
ReportCommand		cat > t-verify-self-spf-report.out
